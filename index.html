<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Center scroll look test — SC-2 fixed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#191928; --cream:#faf8f5; --blue:#452b8a; --pink:#feb58f; --green:#428ba1; --red:#fd7933; --yellow:#f0c23b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--blue); color:var(--ink); font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #track{ height:1150vh; position:relative; }
  #stage{ position:sticky; top:0; height:100vh; height:100svh; overflow:hidden; }
  #back{ position:absolute; inset:0; background:var(--blue); }
  #word{ position:absolute; left:18px; right:-4vw; top:138px; text-align:left; font-family:"Sora",sans-serif; font-weight:700; font-size:21vw; line-height:.9; letter-spacing:-.04em; color:var(--cream); white-space:nowrap; will-change:transform,opacity; }
  #scene{ position:absolute; inset:0; width:100%; height:100%; will-change:transform; }
  #cover{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #grain{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.16; mix-blend-mode:multiply; }
  #top{ position:absolute; left:20px; right:20px; top:76px; font-size:6vw; line-height:1.08; font-family:"Manrope",sans-serif; font-weight:600; color:var(--cream); }
  #top span{ display:inline-block; opacity:0; transform:translateY(14px); transition:none; margin-right:.22em; }
  #brand{ position:absolute; left:16px; top:12px; background:#fff; border:1px solid rgba(69,43,138,.25); border-radius:10px; padding:5px 8px; box-shadow:0 2px 10px rgba(25,25,40,.18); line-height:0; }
  #brand img{ height:32px; width:auto; display:block; }
  #endline{ position:absolute; left:20px; right:20px; top:120px; font-family:"Sora",sans-serif; font-weight:600; font-size:9vw; line-height:1.05; color:var(--ink); opacity:0; }
  #scrollcue{ position:absolute; left:50%; transform:translateX(-50%); bottom:88px; color:var(--cream); line-height:0; pointer-events:none; }
  #cta{ position:absolute; left:16px; right:16px; bottom:18px; height:56px; border:0; border-radius:28px; background:var(--blue); color:var(--cream); font:600 18px "Sora",sans-serif; letter-spacing:.01em; opacity:0; visibility:hidden; }
  #cta:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  @media (min-width:700px){ #brand img{ height:36px; } #word{ font-size:130px; top:196px; } #top{ font-size:44px; max-width:640px; top:84px; } #endline{ top:84px; font-size:64px; } #cta{ left:50%; right:auto; width:430px; transform:translateX(-50%); } }
</style>
</head>

<script>
"use strict";
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const seg = (p,a,b) => clamp((p-a)/(b-a), 0, 1);
const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const lerp = (a,b,t) => a + (b-a)*t;
function mix(c1,c2,t){ const h = c => [1,3,5].map(i => parseInt(c.slice(i,i+2),16)); const a = h(c1), b = h(c2); return "rgb(" + a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(",") + ")"; }

/* board squares */
(function(){ const g = $("#squares"); let h = ""; for(let r=0;r<2;r++) for(let c=0;c<8;c++) if((r+c)%2===0) h += '<rect x="'+(c*18)+'" y="'+(r*13)+'" width="18" height="13"/>'; g.innerHTML = h; })();

/* the top line, one word at a time */
const LINE = "Where a young child practices being".split(" ");
$("#top").innerHTML = LINE.map(w => "<span>"+w+"</span>").join("");
const spans = [...document.querySelectorAll("#top span")];

const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let p = 0, P = 0, Ps = 0;
function readScroll(){ const tr = $("#track"); const max = tr.offsetHeight - window.innerHeight; P = clamp((window.scrollY - tr.offsetTop) / Math.max(1,max), 0, 1); }
window.addEventListener("scroll", readScroll, {passive:true});
window.addEventListener("resize", readScroll);

function place(id, x, y, o){ const e = $(id); e.setAttribute("transform", "translate("+x.toFixed(1)+","+y.toFixed(1)+")"); if(o!=null) e.setAttribute("opacity", o.toFixed(2)); }

/* the row at the end: the same thing five times, each one going still in turn */
const ROW = [{x:66,c:"#fd7933",j:"#2f4d96"},{x:131,c:"#f0c23b",j:"#3a3836"},{x:196,c:"#428ba1",j:"#27407d"},{x:261,c:"#452b8a",j:"#8d8a85"},{x:326,c:"#feb58f",j:"#2f4d96"}];
(function(){ let legs = "", sh = "", bd = "";
  ROW.forEach((k,i) => {
    sh += '<ellipse id="rs'+i+'" cx="'+k.x+'" cy="596" rx="26" ry="5" fill="#191928" opacity=".2"/>';
    legs += '<line x1="'+(k.x-20)+'" y1="412" x2="'+(k.x-24)+'" y2="592" stroke="#191928" stroke-width="4"/><line x1="'+(k.x+20)+'" y1="412" x2="'+(k.x+24)+'" y2="592" stroke="#191928" stroke-width="4"/>';
    [-9,9].forEach((dx,n) => { const x = k.x+dx; legs += '<g id="rl'+i+n+'"><rect x="'+(x-7)+'" y="416" width="14" height="64" rx="7" fill="'+k.j+'"/><path d="M'+(x-9)+' 476 h22 a7 7 0 0 1 7 7 v6 h-29 z" fill="'+k.c+'"/><rect x="'+(x-9)+'" y="487" width="29" height="4" rx="2" fill="#fff"/></g>'; });
    bd += '<rect x="'+(k.x-24)+'" y="390" width="48" height="8" fill="#efe6c8" stroke="#428ba1" stroke-width="2"/><rect x="'+(k.x-24)+'" y="390" width="12" height="8" fill="#5e8c5a"/><rect x="'+k.x+'" y="390" width="12" height="8" fill="#5e8c5a"/><path d="M'+(k.x+8)+' 390 h8 l-2 -8 a4 4 0 1 0 -4 0 z" fill="#191928"/><path d="M'+(k.x-14)+' 390 h8 l-2 -8 a4 4 0 1 0 -4 0 z" fill="#fff" stroke="#191928" stroke-width="1"/>';
  });
  $("#rowLegs").innerHTML = legs; $("#rowShadows").innerHTML = sh; $("#rowBoards").innerHTML = bd; })();

function frame(ms){
  const t = ms/1000;
  /* smoothed scroll: the picture glides to where the thumb is */
  Ps += (P - Ps) * (reduce ? 1 : .14); if(Math.abs(P-Ps) < .0002) Ps = P;
  p = clamp((Ps - .06) / .78, 0, 1);

  /* opening: the scene seen through the letters of one word, then the letters grow and let go */
  const cv = $("#cover"), co = 1 - seg(Ps, .045, .075);
  if(co <= 0){ cv.style.display = "none"; } else { cv.style.display = ""; cv.style.opacity = co.toFixed(2); const k = 1 + 9*Math.pow(seg(Ps, .012, .075), 2.2); $("#holeText").setAttribute("transform", "translate(150 380) scale(" + k.toFixed(3) + ") translate(-150 -380)"); }

  /* closing: the row */
  const ro = seg(Ps, .875, .905), rw = $("#row");
  if(ro <= 0){ rw.style.display = "none"; } else { rw.style.display = ""; rw.setAttribute("opacity", ro.toFixed(2));
    ROW.forEach((k,i) => { const a = lerp(22, 0, ease(seg(Ps, .915 + i*.014, .935 + i*.014))); const ph = Ps*80 + i*1.3;
      [0,1].forEach(n => { const ang = a*Math.sin(ph + n*2.1); $("#rl"+i+n).setAttribute("transform", "rotate(" + ang.toFixed(2) + " " + (k.x + (n?9:-9)) + " 418)"); });
      $("#rs"+i).setAttribute("cx", (k.x - a*Math.sin(ph)*.5).toFixed(1)); }); }

  /* backdrop colour per beat: blue, pink, cream */
  let bg = "#452b8a";
  if(p > .30) bg = mix("#452b8a", "#feb58f", ease(seg(p,.30,.38)));
  if(p > .62) bg = mix("#feb58f", "#faf8f5", ease(seg(p,.62,.72)));
  $("#back").style.background = bg; document.body.style.background = bg;
  const lightText = p < .34 && co < .5;
  const ink = lightText ? "#faf8f5" : "#191928";
  $("#top").style.color = ink; $("#brand").style.color = ink; $("#scrollcue").style.color = ink;

  /* top line: word by word, then leaves */
  spans.forEach((s,i) => { const a = seg(p, .01 + i*.012, .03 + i*.012); const out = seg(p, .86, .92); s.style.opacity = (a*(1-out)).toFixed(2); s.style.transform = "translateY(" + (14*(1-a)).toFixed(1) + "px)"; });
  $("#scrollcue").style.opacity = (1 - seg(Ps, .01, .03)).toFixed(2);
  $("#endline").style.opacity = seg(Ps, .905, .96).toFixed(2);
  /* the ask arrives with the endline, not before the story — and only on the last frame:
     both are driven on raw track depth so they open with the completed closing row
     (row reaches full at Ps .905), never during the boy's scene */
  const cto = seg(Ps, .905, .96), ctaEl = $("#cta");
  ctaEl.style.opacity = cto.toFixed(2); ctaEl.style.visibility = cto <= 0 ? "hidden" : "visible"; ctaEl.style.pointerEvents = cto < .5 ? "none" : "auto";

  /* the big word behind the scene */
  const w = $("#word"); let word = "", wo = 0, wy = 0, wc = "#faf8f5";
  if(p >= .10 && p < .32){ word = "patient"; wo = seg(p,.10,.15) * (1-seg(p,.28,.32)); wy = 40*(1-ease(seg(p,.10,.16))); }
  else if(p >= .32 && p < .64){ word = "resilient"; wo = seg(p,.34,.39) * (1-seg(p,.60,.64)); wy = 40*(1-ease(seg(p,.34,.40))); wc = "#452b8a"; }
  else if(p >= .64 && p < .90){ word = "focused"; wo = seg(p,.66,.72) * (1-seg(p,.86,.90)); wy = 40*(1-ease(seg(p,.66,.73))); wc = "#428ba1"; }
  if(w.textContent !== word) w.textContent = word;
  w.style.opacity = wo.toFixed(2); w.style.color = wc; w.style.transform = "translateY(" + wy.toFixed(1) + "px)";
  w.style.fontSize = word === "resilient" ? "min(19vw,130px)" : "";

  /* one short push in toward the board, and back, inside beat 2 */
  const push = Math.sin(Math.PI * seg(p, .14, .28));
  const sc = 1 + .14*push;
  $("#scene").style.transform = "scale(" + sc.toFixed(3) + ")"; $("#scene").style.transformOrigin = "62% 58%";

  /* the game: four moves */
  const m1 = ease(seg(p, .17, .23));           /* her bishop comes out */
  const m2 = ease(seg(p, .36, .40));           /* he moves a pawn */
  const m3 = ease(seg(p, .45, .53));           /* her bishop takes it */
  const m4 = ease(seg(p, .56, .60));           /* his knight steps beside her bishop */
  let bx = lerp(300, 262, m1), by = lerp(404, 414, m1);
  bx = lerp(bx, 232, m3); by = lerp(by, 420, m3);
  place("#wBishop", bx, by);
  const pwx = lerp(214, 232, m2), pwy = lerp(416, 420, m2) - 70*m3;
  place("#bPawn2", pwx, pwy, 1 - m3);
  $("#bPawn2").setAttribute("transform", "translate(" + pwx.toFixed(1) + "," + pwy.toFixed(1) + ") scale(" + (1 + .85*m3).toFixed(2) + ")");
  place("#bKnight", lerp(188, 212, m4), lerp(422, 426, m4));
  /* her hand reaches for each of her moves and goes back to rest */
  const reach = Math.max(Math.sin(Math.PI*seg(p,.16,.25)), Math.sin(Math.PI*seg(p,.45,.53)));
  place("#girlArm", lerp(-30, -100, reach), lerp(0, 4, reach));
  /* his hand: resting, reaching on his moves, then to his chin */
  const hisReach = Math.max(Math.sin(Math.PI*seg(p,.35,.42)), Math.sin(Math.PI*seg(p,.55,.62)));
  const chin = ease(seg(p, .64, .70));
  $("#armRest").setAttribute("opacity", (1-chin).toFixed(2));
  $("#armRest").setAttribute("transform", "translate(" + (18*hisReach).toFixed(1) + "," + (4*hisReach).toFixed(1) + ")");
  $("#armChin").setAttribute("opacity", chin.toFixed(2));

  /* the sneakers: swing hard, shorter at each of his moves, one kick when she takes his pawn, then still */
  let amp = 26;
  amp = lerp(amp, 16, ease(seg(p, .38, .44)));
  amp = lerp(amp, 7, ease(seg(p, .58, .64)));
  amp = lerp(amp, 0, ease(seg(p, .66, .74)));
  const kick = Math.sin(Math.PI * seg(p, .49, .56));
  amp += 18*kick;
  const phase = p*60;
  const aA = amp*Math.sin(phase) - 6*kick, aB = amp*Math.sin(phase + 2.2) - 10*kick;
  $("#shinA").setAttribute("transform", "rotate(" + aA.toFixed(2) + " 146 461)");
  $("#shinB").setAttribute("transform", "rotate(" + aB.toFixed(2) + " 150 456)");
  $("#shA").setAttribute("cx", (152 - aA*1.0).toFixed(1)); $("#shB").setAttribute("cx", (160 - aB*1.0).toFixed(1));

  /* flipbook: two real poses. The swing pose shows less and less as he settles, once more at the kick, then never */
  const v = Math.max(kick, amp*Math.sin(phase*.8)/26);
  const fi = v < -.6 ? 0 : v < -.2 ? 1 : v < .2 ? 2 : v < .5 ? 3 : v < .8 ? 4 : 5;
  document.querySelectorAll(".pose").forEach((el,k) => el.style.display = k === fi ? "" : "none");

  /* the small smile in the last beat */
  const sm = ease(seg(p, .68, .745));
  $("#smile").setAttribute("opacity", sm.toFixed(2)); $("#mouth").setAttribute("opacity", (1-sm).toFixed(2));

  requestAnimationFrame(frame);
}

/* wide screens: reframe so the protagonist stays in frame (SC-8 repair) */
function fitScene(){ const scEl = $("#scene"), a = window.innerWidth / Math.max(1, window.innerHeight);
  if(a >= .85){ const H = 485, W = H * a, cx = 200; scEl.setAttribute("viewBox", (cx - W/2).toFixed(1) + " 235 " + W.toFixed(1) + " " + H); $("#row").setAttribute("transform", "translate(0,0)"); }
  else { scEl.setAttribute("viewBox", "20 110 350 610"); $("#row").setAttribute("transform", "translate(0,-85)"); } }
window.addEventListener("resize", fitScene); fitScene();

readScroll(); requestAnimationFrame(frame);
</script>
